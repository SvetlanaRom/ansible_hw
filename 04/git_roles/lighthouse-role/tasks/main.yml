---
# tasks file for lighthouse-role
- name: Get lighthouse files
  become: true
  ansible.builtin.file:
    path: /var/www/lighthouse
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Copy files Lighthouse
  become: true
  ansible.builtin.copy:
    src: "{{ lighthouse_configs_dir }}"
    dest: /var/www/lighthouse/
    owner: www-data
    group: www-data
    directory_mode: '0755'
    mode: '0644'

- name: Configure nginx for lighthouse
  become: true
  ansible.builtin.template:
    src: "{{ lighthouse_nginx_conf_template }}"
    dest: /etc/nginx/conf.d/lighthouse.conf
    owner: root
    group: root
    mode: "0644"
  notify: Start nginx service