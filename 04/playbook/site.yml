---
- name: Install Clickhouse
  hosts: clickhouse
  # gather_facts: false

  # handlers:
  #   - name: Start clickhouse service
  #     become: true
  #     ansible.builtin.service:
  #       name: clickhouse-server
  #       state: restarted

  pre_tasks:
    - name: Install Python
      become: true
      ansible.builtin.raw: apt-get update && apt-get install -y python3
      changed_when: false

  roles:
    - role: clickhouse
      vars:
        clickhouse_http_port: "{{ clickhouse_port }}"
        clickhouse_dbs_custom: 
          - name: "{{ clickhouse_db }}"
      tags:
        - install
        - config

  post_tasks:
    - name: Create table
      ansible.builtin.command: >
        clickhouse-client -q 'CREATE TABLE {{ clickhouse_db }}.{{ clickhouse_table }} (
          timestamp DateTime64(3),
          host String,
          appname String,
          procid String,
          facility String,
          severity String,
          message String
        ) ENGINE = MergeTree() ORDER BY timestamp;'
      register: create_table
      failed_when: create_table.rc != 0 and create_table.rc != 57
      changed_when: create_table.rc == 0

